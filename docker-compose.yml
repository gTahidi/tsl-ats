services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - POSTGRES_URL_NON_POOLING=${POSTGRES_URL_NON_POOLING}
        - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
        - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME}
        - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
        - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
        - NEXT_PUBLIC_FARO_APP_VERSION=${NEXT_PUBLIC_FARO_APP_VERSION}
        - NEXT_PUBLIC_FARO_ENVIRONMENT=${NEXT_PUBLIC_FARO_ENVIRONMENT}
        - CALCOM_API_KEY=${CALCOM_API_KEY}
    environment:
      NODE_ENV: production
      SERVICE_FQDN_WEB_3000: ${SERVICE_FQDN_WEB_3000}
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_URL_NON_POOLING: ${POSTGRES_URL_NON_POOLING}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
      BLOB_PREFIX: ${BLOB_PREFIX}
      CALCOM_API_KEY: ${CALCOM_API_KEY}
      CALCOM_API_URL: ${CALCOM_API_URL}
      CALCOM_ORG_SLUG: ${CALCOM_ORG_SLUG}
      POSTMARK_API_KEY: ${POSTMARK_API_KEY}
      POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL}
      BILLING_CHECKOUT_URL: ${BILLING_CHECKOUT_URL}
      BILLING_PORTAL_URL: ${BILLING_PORTAL_URL}
      SENTRY_DSN: ${SENTRY_DSN}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
